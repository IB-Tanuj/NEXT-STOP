<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebGL Rain Landing Page</title>
    <style>
        /* Reset and layout */
        body, html {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0b0f19;
            overflow: hidden;
            width: 100%;
            height: 100%;
        }

        /* Canvas Background Layer */
        #rainCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            pointer-events: none;
        }

        /* Landing Page Content Overlay */
        .hero-container {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100%;
            text-align: center;
            color: #ffffff;
            padding: 20px;
            background: radial-gradient(circle at center, rgba(11, 15, 25, 0.2) 0%, rgba(11, 15, 25, 0.7) 100%);
        }

        h1 {
            font-size: 3.5rem;
            margin-bottom: 20px;
            letter-spacing: 2px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }

        p {
            font-size: 1.2rem;
            max-width: 600px;
            margin-bottom: 30px;
            color: #a0aec0;
            line-height: 1.6;
        }

        .cta-btn {
            padding: 12px 30px;
            font-size: 1rem;
            font-weight: bold;
            color: #ffffff;
            background: linear-gradient(135deg, #3182ce 0%, #2b6cb0 100%);
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 15px rgba(49, 130, 206, 0.4);
        }

        .cta-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(49, 130, 206, 0.6);
        }
    </style>
</head>
<body>

    <!-- Canvas Layer -->
    <canvas id="rainCanvas"></canvas>

    <!-- NO EXTERNAL SCRIPTS NEEDED anymore -->
    <script>
        const canvas = document.getElementById('rainCanvas');
        const ctx = canvas.getContext('2d');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        // Optimized particle count for smooth 60fps on your i3 processor
        const rainCount = 180; 
        const drops = [];

        // Generate depth-simulated raindrops
        for (let i = 0; i < rainCount; i++) {
            const depth = Math.random(); // 0 (far away, slow) to 1 (close up, fast)
            drops.push({
                x: Math.random() * width,
                y: Math.random() * height - height,
                length: 10 + depth * 25,       
                speed: 6 + depth * 12,         
                opacity: 0.1 + depth * 0.4,    
                weight: 1 + depth * 1.5        
            });
        }

        // Animation Loop
        const animate = () => {
            ctx.clearRect(0, 0, width, height);

            for (let i = 0; i < rainCount; i++) {
                const p = drops[i];

                // Draw the glowing rain stroke
                ctx.beginPath();
                ctx.lineWidth = p.weight;
                ctx.lineCap = 'round';
                ctx.strokeStyle = `rgba(174, 219, 255, ${p.opacity})`;
                ctx.moveTo(p.x, p.y);
                ctx.lineTo(p.x - 1, p.y + p.length); // Slight angle for realism
                ctx.stroke();

                // Move raindrop downward
                p.y += p.speed;

                // Reset drop seamlessly back to top when it passes screen bounds
                if (p.y > height) {
                    p.y = -p.length;
                    p.x = Math.random() * width;
                }
            }

            requestAnimationFrame(animate);
        };

        animate();

        // Responsive Resize Handler
        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });
    </script>
</body>
</html>
