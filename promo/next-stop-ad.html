<!doctype html>
<!--
  NEXT·STOP — 30s vertical (9:16) generative motion ad
  ----------------------------------------------------
  • Open this file directly in Chrome/Edge (or via `npm run dev` → /promo/next-stop-ad.html)
  • Everything is drawn on ONE 1080×1920 canvas as a pure function of time t,
    so it is scrubbable and the "Export video" button records a pixel-perfect file.
  • URL params:  ?t=12.5  (jump & pause)   ?clean=1  (hide controls, full-height)
  • Keys: Space play/pause · ←/→ seek 1s (Shift = 0.1s) · R restart · H hide UI
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>NEXT·STOP — 30s Vertical Ad (9:16)</title>
<meta name="description" content="A 30-second generative motion ad for NEXT·STOP — the real-time trip co-pilot for India. Renders live in the browser and exports to video." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />
<style>
  :root { --y:#fde047; --ink:#1e1b4b; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { height:100%; }
  body {
    background: radial-gradient(1200px 800px at 50% 40%, #1a1240 0%, #07051a 60%, #030210 100%);
    color:#e2e8f0; font-family: Inter, system-ui, sans-serif; overflow:hidden;
  }
  .sr-only { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
  main { height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; padding:14px; }
  #stage {
    height: calc(100vh - 110px); width:auto; aspect-ratio: 9 / 16; max-width:100%;
    border-radius:22px; background:#000;
    box-shadow: 0 40px 120px rgba(0,0,0,.7), 0 0 0 1px rgba(255,255,255,.07), 0 0 90px rgba(253,224,71,.07);

    display:flex; align-items:center; gap:10px; padding:10px 14px; border-radius:999px;
    background: rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.1);
    backdrop-filter: blur(14px); width:min(780px, 100%);
  }
  .controls button {
    font: 600 13px Inter, sans-serif; color:#e2e8f0; background: rgba(255,255,255,.07);
    border:1px solid rgba(255,255,255,.12); border-radius:999px; padding:8px 14px; cursor:pointer;
    transition: all .2s ease; white-space:nowrap;
  }
  .controls button:hover { background: rgba(253,224,71,.14); border-color: rgba(253,224,71,.5); color: var(--y); transform: translateY(-1px); }
  .controls button.primary { background: var(--y); color: var(--ink); border-color: var(--y); }
  .controls button.primary:hover { color: var(--ink); box-shadow: 0 8px 24px rgba(253,224,71,.35); }
  .controls button:disabled { opacity:.5; cursor:default; transform:none; }
  #scrub { flex:1; accent-color: var(--y); cursor:pointer; }
  #time { font: 500 12px "JetBrains Mono", monospace; color:#94a3b8; min-width: 104px; text-align:right; }
  #status { font: 500 12px Inter, sans-serif; color:#94a3b8; min-height:16px; }
  #status b { color: var(--y); }
  body.clean main { padding:0; gap:0; }
  body.clean #stage { height:100vh; border-radius:0; box-shadow:none; }
  body.clean .controls, body.clean #status { display:none; }
</style>
</head>
<body>
<main>
  <h1 class="sr-only">NEXT·STOP — 30 second vertical ad</h1>
  <canvas id="stage" width="1080" height="1920" aria-label="NEXT·STOP animated advertisement"></canvas>
  <div class="controls">
    <button id="btn-play" type="button">Pause</button>
    <button id="btn-restart" type="button">Restart</button>
    <input id="scrub" type="range" min="0" max="30000" step="10" value="0" aria-label="Timeline" />
    <span id="time">00.00 / 30.00</span>
    <button id="btn-export" class="primary" type="button">Export video</button>
  </div>
  <div id="status">Space play/pause · ←/→ seek · R restart · H hide controls</div>
</main>

<script>
(() => {
'use strict';

/* ════════════════════════════════════════════════════════════
   CORE / UTILS
   ════════════════════════════════════════════════════════════ */
const W = 1080, H = 1920, DUR = 30, TAU = Math.PI * 2;
const Y = '#fde047', INK = '#1e1b4b';
const FLIGHT = '#fde047', TRAIN = '#67e8f9', BUS = '#f472b6';

const cvs = document.getElementById('stage');
const ctx = cvs.getContext('2d');

const clamp = (v, a = 0, b = 1) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const inv = (a, b, v) => clamp((v - a) / (b - a));
const E = {
  outCubic: t => 1 - Math.pow(1 - t, 3),
  inCubic: t => t * t * t,
  inOutCubic: t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,
  outExpo: t => t >= 1 ? 1 : 1 - Math.pow(2, -10 * t),
  outBack: t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); },

function win(t, a, b, fi = .4, fo = .4) {

  const i = fi > 0 ? clamp((t - a) / fi) : 1;

function keyf(keys, t) {

}

/* ── drawing helpers ── */

}

}

/* ── kinetic typography: per-character rise-in / lift-out ── */
function kinetic(segs, x, y, o) {
  const t = o.t, t0 = o.t0, t1 = o.t1 ?? 1e9, size = o.size ?? 80, weight = o.weight ?? 700,
    fam = o.fam ?? 'Space Grotesk', align = o.align ?? 'center', st = o.stagger ?? .03,
    dur = o.dur ?? .6, exitDur = o.exitDur ?? .35, glowAmt = o.glow ?? 0;

  for (const [s, c] of segs) for (const ch of Array.from(s)) { chars.push(ch); cols.push(c); }
  const n = chars.length;
  if (t > t1 + exitDur + n * st * .4) return;

  ctx.font = font(size, weight, fam); ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  const total = ctx.measureText(chars.join('')).width;

/* ── glow sprites ── */

  rg.addColorStop(0, `rgba(${r},${gg},${b},1)`); rg.addColorStop(1, `rgba(${r},${gg},${b},0)`);

}

  ctx.save(); ctx.globalAlpha = a; ctx.drawImage(soft(color), x - size / 2, y - size / 2, size, size); ctx.restore();
}

/* ── static layers ── */
const pLayer = mk(W, H), pctx = pLayer.getContext('2d');
const bloom = mk(W / 4, H / 4), bctx = bloom.getContext('2d');
const bgGrad = mk(W, H);
{ const g = bgGrad.getContext('2d'), lg = g.createLinearGradient(0, 0, 0, H);
  lg.addColorStop(0, '#06041a'); lg.addColorStop(.5, '#130c3a'); lg.addColorStop(1, '#22104d');
  g.fillStyle = lg; g.fillRect(0, 0, W, H); }
const vign = mk(W, H);
{ const g = vign.getContext('2d'), rg = g.createRadialGradient(540, 960, 380, 540, 960, 1250);
  rg.addColorStop(0, 'rgba(0,0,0,0)'); rg.addColorStop(1, 'rgba(0,0,0,.7)');
  g.fillStyle = rg; g.fillRect(0, 0, W, H); }
const grain = mk(256, 256);
{ const g = grain.getContext('2d'), id = g.createImageData(256, 256);
  for (let i = 0; i < id.data.length; i += 4) { const v = rand() * 255; id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = 255; }
  g.putImageData(id, 0, 0); }

/* ════════════════════════════════════════════════════════════
   GEOGRAPHY — dot-matrix India
   ════════════════════════════════════════════════════════════ */
const INDIA = [[74.0,37.0],[75.5,36.8],[77.8,35.5],[79.0,34.3],[78.8,32.5],[79.5,30.9],[81.0,30.2],[80.1,28.8],[83.0,27.4],[85.5,26.6],[88.1,26.5],[88.2,27.9],[88.9,27.3],[89.8,26.7],[92.0,26.8],[94.0,27.6],[95.5,28.2],[97.3,28.0],[96.0,27.0],[95.0,26.0],[94.6,24.8],[93.5,23.9],[92.6,22.0],[92.2,23.6],[91.5,24.1],[91.9,25.2],[90.0,25.2],[89.8,26.0],[88.4,26.3],[88.7,24.3],[88.8,22.0],[87.0,21.5],[86.5,20.0],[85.0,19.3],[83.5,18.0],[82.3,16.6],[80.3,15.8],[80.2,13.5],[79.8,11.5],[79.3,10.3],[78.2,8.9],[77.5,8.1],[76.5,9.0],[75.8,11.5],[74.8,13.0],[74.1,15.0],[73.2,17.5],[72.8,19.0],[72.6,21.2],[70.5,20.8],[69.0,22.3],[68.4,23.6],[70.0,24.5],[71.0,24.4],[70.0,25.7],[70.3,27.5],[72.0,28.4],[73.4,29.9],[74.5,31.0],[74.7,32.5],[74.0,33.5],[73.8,34.6]];
const KX = Math.cos(22 * Math.PI / 180), MS = 33;
const proj = (lon, lat) => [540 + (lon - 82.75) * KX * MS, 1080 - (lat - 22.5) * MS];
const POLY = INDIA.map(p => proj(p[0], p[1]));
function inPoly(x, y) {
  let c = false;
  for (let i = 0, j = POLY.length - 1; i < POLY.length; j = i++) {
    const [xi, yi] = POLY[i], [xj, yj] = POLY[j];
    if (((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi)) c = !c;
  }
  return c;
}
const dots = [];
{ const STEP = 13; let r = 0;
  for (let y = 560; y < 1600; y += STEP * .866, r++)
    for (let x = 60 + (r % 2) * STEP / 2; x < 1020; x += STEP) if (inPoly(x, y)) dots.push([x, y]);
  shuffle(dots); }

const CITIES = {
  delhi: ['Delhi', 77.2, 28.6, 'r'], mumbai: ['Mumbai', 72.95, 19.07, 'l'], jaipur: ['Jaipur', 75.8, 26.9, 'l'],
  goa: ['Goa', 74.05, 15.4, 'l'], varanasi: ['Varanasi', 83.0, 25.3, 'r'], kolkata: ['Kolkata', 88.3, 22.57, 'r'],
  chennai: ['Chennai', 80.1, 13.08, 'r'], srinagar: ['Srinagar', 74.8, 34.08, 'r'], rishikesh: ['Rishikesh', 78.27, 30.08, 'r'],
  udaipur: ['Udaipur', 73.7, 24.58, 'l'], bengaluru: ['Bengaluru', 77.6, 12.97, 'l'], kochi: ['Kochi', 76.3, 9.93, 'l'],
  darjeeling: ['Darjeeling', 88.26, 27.04, 'r'], hyderabad: ['Hyderabad', 78.47, 17.38, 'r'],
};
const CITY_XY = {}; Object.entries(CITIES).forEach(([k, c]) => CITY_XY[k] = proj(c[1], c[2]));
const ROUTES = [
  ['delhi', 'jaipur', TRAIN, 5.7], ['delhi', 'srinagar', FLIGHT, 6.0], ['mumbai', 'goa', BUS, 6.3],
  ['delhi', 'varanasi', TRAIN, 6.6], ['mumbai', 'delhi', FLIGHT, 6.9], ['kolkata', 'darjeeling', TRAIN, 7.2],
  ['bengaluru', 'kochi', BUS, 7.5], ['jaipur', 'udaipur', BUS, 7.8], ['delhi', 'rishikesh', BUS, 8.0],
  ['chennai', 'kolkata', FLIGHT, 8.2], ['hyderabad', 'bengaluru', TRAIN, 8.4], ['mumbai', 'hyderabad', FLIGHT, 8.6],
].map(([a, b, col, t0]) => {
  const A = CITY_XY[a], B = CITY_XY[b], dx = B[0] - A[0], dy = B[1] - A[1], len = Math.hypot(dx, dy);
  let nx = -dy / len, ny = dx / len; if (ny > 0) { nx = -nx; ny = -ny; }
  return { A, B, C: [(A[0] + B[0]) / 2 + nx * len * .28, (A[1] + B[1]) / 2 + ny * len * .28], col, t0 };
});

/* ════════════════════════════════════════════════════════════
   PARTICLES — every position is a pure function of (i, t)
   ════════════════════════════════════════════════════════════ */
const N = 3200;
const R = Array.from({ length: 8 }, () => new Float32Array(N));
for (let k = 0; k < 8; k++) for (let i = 0; i < N; i++) R[k][i] = rand();
const DX = new Float32Array(N), DY = new Float32Array(N), LX = new Float32Array(N), LY = new Float32Array(N);
for (let i = 0; i < N; i++) {
  const d = dots[i % dots.length], extra = i >= dots.length;
  DX[i] = d[0] + (extra ? (R[0][i] - .5) * 3 : 0); DY[i] = d[1] + (extra ? (R[1][i] - .5) * 3 : 0);

let PX_ = 0, PY_ = 0;

const PH = { x: 240, y: 400, w: 600, h: 1240, r: 86 };
const SC = { x: 256, y: 416, w: 568, h: 1208, r: 72 };
function phoneT(t) {
  const enter = E.outBack(inv(11.5, 12.6, t)), exit = E.inCubic(inv(23.9, 24.45, t));
  return { cx: 540, cy: 1020 + Math.sin(t * 1.1) * 8, rot: Math.sin(t * .6) * .014, s: lerp(.9, 1, enter) + exit * .08 };

function rrPoint(x, y, w, h, r, u) {
  const sw = w - 2 * r, sh = h - 2 * r, q = Math.PI * r / 2, L = 2 * sw + 2 * sh + 4 * q;
  let s = u * L;
  if (s < sw) { PX_ = x + r + s; PY_ = y; return; } s -= sw;

  if (s < sh) { PX_ = x + w; PY_ = y + r + s; return; } s -= sh;
  if (s < q) { const a = s / r; PX_ = x + w - r + Math.cos(a) * r; PY_ = y + h - r + Math.sin(a) * r; return; } s -= q;
  if (s < sw) { PX_ = x + w - r - s; PY_ = y + h; return; } s -= sw;
  if (s < q) { const a = Math.PI / 2 + s / r; PX_ = x + r + Math.cos(a) * r; PY_ = y + h - r + Math.sin(a) * r; return; } s -= q;

/* S0 — singularity */
function S0(i) { PX_ = 540 + (R[0][i] - .5) * 6; PY_ = 960 + (R[1][i] - .5) * 6; }
/* S1 — tilted spiral galaxy w/ flow-noise */

/* S2 — India dot-matrix with city ripples */

/* S3 — neon phone edge + orbit halo */
const NPER = Math.floor(N * .45);

  c.font = font(150, 700, 'Space Grotesk'); c.fillText('NEXT·STOP', 540, 960);
}
function buildLogoTargets() {
  const off = mk(W, H), c = off.getContext('2d');
  drawLogoTargets(c);
  const d = c.getImageData(0, 0, W, H).data, cand = [];
  for (let y = 0; y < H; y += 3) for (let x = 0; x < W; x += 3) if (d[(y * W + x) * 4 + 3] > 128) cand.push([x, y]);
  shuffle(cand);
  for (let i = 0; i < N; i++) { const p = cand[i % cand.length]; LX[i] = p[0] + (R[0][i] - .5) * 2; LY[i] = p[1] + (R[1][i] - .5) * 2; }
}
function scene4(t) {
  if (t < 24.6) return;
  const sp = seasonPos(t), ai = Math.min(5, Math.floor(sp));
  const sCol = sp > 0 && sp < 6 ? PAL.seasons[ai][0] : Y;
  drawGlow(sCol, 540, 860, 1100 + Math.sin(t * 2) * 40, .22 * inv(25.0, 26.0, t));
  const a = E.outCubic(inv(25.3, 26.0, t));
  if (a > 0) {
    ctx.save(); ctx.globalAlpha = a;
    ctx.shadowColor = 'rgba(253,224,71,.55)'; ctx.shadowBlur = 44;
    rr(MARK.x, MARK.y, MARK.s, MARK.s, 40); ctx.fillStyle = Y; ctx.fill();
    ctx.shadowBlur = 0;
    txt('N→S', 540, MARK.y + 101, 58, 700, INK, 'center', 'Space Grotesk');
    ctx.shadowColor = 'rgba(253,224,71,.45)'; ctx.shadowBlur = 36;
    txt('NEXT·STOP', 540, 960, 150, 700, Y, 'center', 'Space Grotesk');
    ctx.restore();
  }
  kinetic([['Every stop, every stay, every fare — ', '#e2e8f0'], ['live.', Y]], 540, 1076, { t, t0: 26.0, size: 37, weight: 500, fam: 'Inter', stagger: .012, dur: .5 });
  // CTA
  const cp = inv(26.8, 27.4, t);
  if (cp > 0) {
    const s = E.outBack(cp);
    ctx.save(); ctx.globalAlpha = clamp(cp * 1.5); ctx.translate(540, 1292); ctx.scale(s, s);
    ctx.save(); ctx.shadowColor = 'rgba(253,224,71,.5)'; ctx.shadowBlur = 50 + Math.sin(t * 4) * 10;
    rr(-250, -52, 500, 104, 52); ctx.fillStyle = Y; ctx.fill(); ctx.restore();
    txt('Start planning  →', 0, 14, 38, 800, INK, 'center');
    ctx.save(); rr(-250, -52, 500, 104, 52); ctx.clip();
    [[27.6, 28.2], [29.0, 29.5]].forEach(([s0, s1]) => {
      const q = inv(s0, s1, t); if (q <= 0 || q >= 1) return;
      const x = lerp(-380, 380, E.inOutSine(q));
      const g = ctx.createLinearGradient(x - 70, 0, x + 70, 0);
      g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(.5, 'rgba(255,255,255,.75)'); g.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.save(); ctx.fillStyle = g; ctx.transform(1, 0, -.35, 1, 0, 0); ctx.fillRect(x - 70, -60, 140, 120); ctx.restore();
    });
    ctx.restore();
    ctx.restore();
  }
  // six seasons
  SEASONS.forEach(([em, name], k) => {
    const p = E.outBack(inv(27.0 + k * .08, 27.45 + k * .08, t)); if (p <= 0) return;
    const x = 140 + k * 160, y = 1500;
    const act = sp > 0 && sp < 6 ? clamp(1 - Math.abs(sp - (k + .5)) * 1.6) : 0;
    ctx.save(); ctx.globalAlpha = clamp(p) * (.55 + .45 * act + (sp >= 6 ? .45 : 0));
    ctx.translate(x, y); ctx.scale(p * (1 + act * .18), p * (1 + act * .18));
    if (act > 0) drawGlow(PAL.seasons[k][0], 0, -18, 150, act * .7);
    txt(em, 0, 0, 54, 400, '#fff', 'center');
    txt(name, 0, 46, 19, 600, act > .3 ? PAL.seasons[k][0] : '#cbd5e1', 'center');
    ctx.restore();
  });
  ctx.save(); ctx.globalAlpha = inv(27.8, 28.4, t);
  spaced('REAL-TIME TRIPS · SEASON BY SEASON', 540, 1760, 22, 600, '#94a3b8', 'center', 6);
  ctx.restore();
}

/* ════════════════════════════════════════════════════════════
   RENDER
   ════════════════════════════════════════════════════════════ */
function render(t) {
  t = clamp(t, 0, DUR);
  drawBG(t);
  drawParticles(t);
  hud(t, win(t, 1.0, 11.2, .8, .5));
  scene1(t);
  scene2(t);
  scene3(t);
  scene4(t);
  drawPost(t);
}

/* ════════════════════════════════════════════════════════════
   PLAYBACK / CONTROLS / EXPORT
   ════════════════════════════════════════════════════════════ */
const $ = id => document.getElementById(id);
const btnPlay = $('btn-play'), btnRestart = $('btn-restart'), btnExport = $('btn-export'), scrub = $('scrub'), timeEl = $('time'), statusEl = $('status');
const params = new URLSearchParams(location.search);
if (params.has('clean')) document.body.classList.add('clean');

let playing = true, cur = 0, last = performance.now(), dirty = true, recording = false, recorder = null, chunks = [], mime = '';
if (params.has('t')) { cur = clamp(parseFloat(params.get('t')) || 0, 0, DUR); playing = false; }

function setPlaying(p) { playing = p; btnPlay.textContent = p ? 'Pause' : 'Play'; last = performance.now(); dirty = true; }
function seek(t) { cur = clamp(t, 0, DUR - .001); dirty = true; }

btnPlay.onclick = () => { if (!recording) setPlaying(!playing); };
btnRestart.onclick = () => { if (!recording) { seek(0); setPlaying(true); } };
scrub.oninput = () => { if (recording) return; seek(scrub.value / 1000); setPlaying(false); };
window.addEventListener('keydown', e => {
  if (recording) return;
  if (e.code === 'Space') { e.preventDefault(); setPlaying(!playing); }
  else if (e.code === 'ArrowRight') seek(cur + (e.shiftKey ? .1 : 1));
  else if (e.code === 'ArrowLeft') seek(cur - (e.shiftKey ? .1 : 1));
  else if (e.code === 'KeyR') { seek(0); setPlaying(true); }
  else if (e.code === 'KeyH') document.body.classList.toggle('clean');
});

btnExport.onclick = () => {
  if (recording) return;
  if (!window.MediaRecorder || !cvs.captureStream) { statusEl.innerHTML = '<b>Export needs Chrome or Edge.</b>'; return; }
  const types = ['video/mp4;codecs=avc1.640034', 'video/mp4;codecs=avc1', 'video/mp4', 'video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm'];
  mime = types.find(m => MediaRecorder.isTypeSupported(m)) || '';
  const stream = cvs.captureStream(60);
  recorder = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 24_000_000 });
  chunks = [];
  recorder.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
  recorder.onstop = () => {
    const blob = new Blob(chunks, { type: mime || 'video/webm' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `next-stop-ad-30s-1080x1920.${(mime || '').includes('mp4') ? 'mp4' : 'webm'}`;
    document.body.appendChild(a); a.click(); a.remove();
    statusEl.innerHTML = `<b>✓ Exported</b> ${(blob.size / 1048576).toFixed(1)} MB · ${a.download}`;
    [btnPlay, btnRestart, btnExport, scrub].forEach(b => b.disabled = false);
  };
  [btnPlay, btnRestart, btnExport, scrub].forEach(b => b.disabled = true);
  seek(0); render(0);
  recorder.start(250);
  recording = true; setPlaying(true);
};

function tick(now) {
  const dt = (now - last) / 1000; last = now;
  if (playing) {
    cur += recording ? dt : Math.min(dt, .1);
    if (cur >= DUR) {
      if (recording) {
        cur = DUR; render(cur); recording = false; setPlaying(false);
        setTimeout(() => recorder && recorder.state !== 'inactive' && recorder.stop(), 250);
      } else cur -= DUR;
    }
    dirty = true;
  }
  if (dirty) {
    render(cur); dirty = false;
    scrub.value = Math.round(cur * 1000);
    timeEl.textContent = `${cur.toFixed(2).padStart(5, '0')} / 30.00`;
    if (recording) statusEl.innerHTML = `<b>● Recording</b> ${cur.toFixed(1)}s / 30s — keep this tab visible`;
  }
  requestAnimationFrame(tick);
}

/* boot: wait for fonts so text & logo particles use the right faces */
const fontLoads = Promise.all([
  '700 150px "Space Grotesk"', '600 40px "Space Grotesk"', '400 20px Inter', '500 20px Inter',
  '600 20px Inter', '700 20px Inter', '800 20px Inter', '500 18px "JetBrains Mono"',
].map(f => document.fonts.load(f)));
Promise.race([fontLoads, new Promise(r => setTimeout(r, 3500))]).then(() => {
  buildLogoTargets();
  btnPlay.textContent = playing ? 'Pause' : 'Play';
  last = performance.now();
  requestAnimationFrame(tick);
  window.__seek = t => { setPlaying(false); seek(t); };
});
})();
</script>
