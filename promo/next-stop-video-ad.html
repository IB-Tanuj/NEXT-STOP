<!doctype html>
<!--
  NEXT·STOP — voiced product video ad
  -----------------------------------
  This is an additional ad. The original /promo/next-stop-ad.html is preserved.
  Click Play with voiceover to hear the timed narration. The visual is rendered
  on a 9:16 canvas so it can also be screen-recorded or exported as a video.
-->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NEXT·STOP — Product Video Ad</title>
  <meta name="description" content="A voiced product video ad for NEXT·STOP, the real-time trip co-pilot for India." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root { --yellow: #fde047; --ink: #1e1b4b; --muted: #94a3b8; }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      color: #e2e8f0;
      background: radial-gradient(900px 700px at 50% 35%, #1c1450, #08061d 62%, #030210);
      font-family: Inter, system-ui, sans-serif;
    }
    main { min-height: 100svh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 16px; }
    #stage { width: min(calc(100vw - 32px), calc((100svh - 124px) * .5625)); height: auto; aspect-ratio: 9 / 16; display: block; border-radius: 22px; background: #07051a; box-shadow: 0 38px 120px rgba(0,0,0,.72), 0 0 0 1px rgba(255,255,255,.1), 0 0 80px rgba(253,224,71,.08); }
    .controls { width: min(720px, 100%); display: flex; align-items: center; gap: 9px; padding: 10px 12px; border: 1px solid rgba(255,255,255,.12); border-radius: 999px; background: rgba(255,255,255,.06); backdrop-filter: blur(18px); }
    button { border: 1px solid rgba(255,255,255,.14); border-radius: 999px; padding: 9px 13px; color: #e2e8f0; background: rgba(255,255,255,.08); font: 700 12px Inter, sans-serif; cursor: pointer; white-space: nowrap; transition: transform .18s ease, background .18s ease, border-color .18s ease; }
    button:hover { transform: translateY(-1px); border-color: rgba(253,224,71,.55); background: rgba(253,224,71,.14); }
    button.primary { color: var(--ink); border-color: var(--yellow); background: var(--yellow); }
    button.primary:hover { background: #fff083; box-shadow: 0 8px 25px rgba(253,224,71,.3); }
    button.voice-off { color: #fda4af; border-color: rgba(244,63,94,.35); }
    #scrub { flex: 1; min-width: 60px; accent-color: var(--yellow); cursor: pointer; }
    #time { min-width: 94px; color: var(--muted); font: 500 11px "DM Mono", monospace; text-align: right; }
    #status { min-height: 17px; color: #94a3b8; font-size: 12px; text-align: center; }
    #status b { color: var(--yellow); }
    .note { max-width: 680px; margin: 0; color: #64748b; font-size: 11px; text-align: center; }
    @media (max-width: 620px) {
      main { padding: 8px; gap: 9px; }
      #stage { width: min(calc(100vw - 16px), calc((100svh - 132px) * .5625)); border-radius: 15px; }
      .controls { flex-wrap: wrap; border-radius: 18px; justify-content: center; }
      #scrub { order: 5; flex-basis: 100%; }
      #time { min-width: auto; }
      .note { display: none; }
    }
  </style>
</head>
<body>
  <main>
    <h1 style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">NEXT·STOP voiced product video advertisement</h1>
    <canvas id="stage" width="720" height="1280" aria-label="NEXT·STOP voiced product video advertisement"></canvas>
    <div class="controls">
      <button id="play" class="primary" type="button">Play with voiceover</button>
      <button id="restart" type="button">Restart</button>
      <button id="voice" type="button">Voiceover on</button>
      <input id="scrub" type="range" min="0" max="24000" step="10" value="0" aria-label="Video timeline" />
      <span id="time">00.00 / 24.00</span>
    </div>
    <div id="status">Click Play with voiceover · Space play/pause · ←/→ seek</div>
    <p class="note">Voiceover uses your browser’s built-in speech voice so the ad works without an external audio file.</p>
  </main>

  <script>
  (() => {
    'use strict';

    const W = 720, H = 1280, DUR = 24, TAU = Math.PI * 2;
    const Y = '#fde047', INK = '#1e1b4b', WHITE = '#f8fafc', MUTED = '#94a3b8';
    const TRAIN = '#67e8f9', BUS = '#f472b6', PURPLE = '#a78bfa', GREEN = '#4ade80';
    const canvas = document.getElementById('stage');
    const ctx = canvas.getContext('2d');
    const playButton = document.getElementById('play');
    const restartButton = document.getElementById('restart');
    const voiceButton = document.getElementById('voice');
    const scrub = document.getElementById('scrub');
    const timeEl = document.getElementById('time');
    const statusEl = document.getElementById('status');
    const jaipur = new Image();
    jaipur.src = '/landing2/jaipur.webp';

    const VOICEOVER = [
      { at: 0.25, label: 'THE IDEA', text: 'You have a destination. NEXT STOP gives you the whole journey.' },
      { at: 3.9, label: 'SEARCH', text: 'Search any city, state, or vibe. Then watch your trip take shape.' },
      { at: 7.8, label: 'BUDGET', text: 'Split your budget across travel, stays, food, and experiences.' },
      { at: 11.7, label: 'LIVE FARES', text: 'Track live fares across trains, buses, and flights.' },
      { at: 15.6, label: 'ITINERARY', text: 'And get a personal itinerary, built around your pace.' },
      { at: 19.5, label: 'CTA', text: 'NEXT STOP. Plan less. Go further.' },
    ];

    let playing = false;
    let voiceEnabled = true;
    let current = 0;
    let last = performance.now();
    let lastVoiceIndex = -1;
    let utterance = null;
    let raf = 0;

    const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
    const inv = (a, b, v) => clamp((v - a) / (b - a));
    const ease = (v) => 1 - Math.pow(1 - clamp(v), 3);
    const fade = (t, a, b, inTime = .35, outTime = .35) => Math.min(clamp((t - a) / inTime), clamp((b - t) / outTime));
    const lerp = (a, b, t) => a + (b - a) * t;

    function rounded(x, y, w, h, r, fill, stroke) {
      ctx.beginPath();
      ctx.roundRect(x, y, w, h, r);
      if (fill) { ctx.fillStyle = fill; ctx.fill(); }
      if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = 1.5; ctx.stroke(); }
    }
    function text(value, x, y, size, weight, color, align = 'left', family = 'Inter') {
      ctx.font = `${weight} ${size}px "${family}", Inter, system-ui, sans-serif`;
      ctx.fillStyle = color;
      ctx.textAlign = align;
      ctx.textBaseline = 'alphabetic';
      ctx.fillText(value, x, y);
    }
    function mono(value, x, y, size, weight, color, align = 'left') { text(value, x, y, size, weight, color, align, 'DM Mono'); }
    function pill(x, y, label, opts = {}) {
      const size = opts.size || 14, px = opts.px || 14, h = opts.h || size + 17;
      ctx.font = `600 ${size}px Inter, sans-serif`;
      const w = ctx.measureText(label).width + px * 2;
      rounded(x, y, w, h, h / 2, opts.fill || 'rgba(255,255,255,.07)', opts.stroke || 'rgba(255,255,255,.14)');
      text(label, x + w / 2, y + h / 2 + size * .34, size, opts.weight || 600, opts.color || '#e2e8f0', 'center');
      return w;
    }
    function glow(x, y, radius, color, alpha = .3) {
      const g = ctx.createRadialGradient(x, y, 0, x, y, radius);
      g.addColorStop(0, color.replace(')', `,${alpha})`).replace('rgb(', 'rgba('));
      g.addColorStop(1, color.replace(')', ',0)').replace('rgb(', 'rgba('));
      ctx.fillStyle = g;
      ctx.fillRect(x - radius, y - radius, radius * 2, radius * 2);
    }
    function imageCover(img, x, y, w, h, radius = 0) {
      if (!img.complete || !img.naturalWidth) return;
      const scale = Math.max(w / img.naturalWidth, h / img.naturalHeight);
      const iw = img.naturalWidth * scale, ih = img.naturalHeight * scale;
      ctx.save();
      if (radius) { rounded(x, y, w, h, radius); ctx.clip(); }
      ctx.drawImage(img, x + (w - iw) / 2, y + (h - ih) / 2, iw, ih);
      ctx.restore();
    }
    function line(x1, y1, x2, y2, color, width = 1) {
      ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.strokeStyle = color; ctx.lineWidth = width; ctx.stroke();
    }
    function wrap(value, x, y, maxWidth, size, lineHeight, color, weight = 500, align = 'left') {
      ctx.font = `${weight} ${size}px Inter, sans-serif`;
      const words = value.split(' '); let row = ''; let yy = y;
      words.forEach((word, index) => {
        const test = `${row}${word} `;
        if (ctx.measureText(test).width > maxWidth && row) { text(row.trim(), x, yy, size, weight, color, align); row = `${word} `; yy += lineHeight; }
        else row = test;
        if (index === words.length - 1) text(row.trim(), x, yy, size, weight, color, align);
      });
      return yy;
    }

    function drawBackground(t) {
      const g = ctx.createLinearGradient(0, 0, 0, H);
      g.addColorStop(0, '#08051e'); g.addColorStop(.52, '#140d3d'); g.addColorStop(1, '#24104d');
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
      if (jaipur.complete) { ctx.save(); ctx.globalAlpha = .075; imageCover(jaipur, 0, 0, W, H); ctx.restore(); }
      const glowOne = ctx.createRadialGradient(570 + Math.sin(t * .4) * 50, 310, 0, 570, 310, 430);
      glowOne.addColorStop(0, 'rgba(124,58,237,.34)'); glowOne.addColorStop(1, 'rgba(124,58,237,0)');
      ctx.fillStyle = glowOne; ctx.fillRect(0, 0, W, H);
      const glowTwo = ctx.createRadialGradient(140, 1040, 0, 140, 1040, 340);
      glowTwo.addColorStop(0, 'rgba(219,39,119,.18)'); glowTwo.addColorStop(1, 'rgba(219,39,119,0)');
      ctx.fillStyle = glowTwo; ctx.fillRect(0, 700, W, 580);
      ctx.fillStyle = 'rgba(0,0,0,.23)'; ctx.fillRect(0, 0, W, H);
    }
    function drawBrand(y = 68, alpha = 1, options = {}) {
      const baseX = options.x || 0;
      ctx.save(); ctx.globalAlpha = alpha;
      rounded(46 + baseX, y - 28, 44, 44, 13, Y);
      text('N→S', 68 + baseX, y + 1, 15, 800, INK, 'center', 'Space Grotesk');
      text('NEXT·STOP', 104 + baseX, y + 1, 17, 800, WHITE, 'left', 'Space Grotesk');
      if (!options.compact) pill(510 + baseX, y - 22, '🍁 SHARAD · LIVE', { size: 11, px: 11, h: 32, color: Y, stroke: 'rgba(253,224,71,.4)', fill: 'rgba(253,224,71,.08)' });
      ctx.restore();
    }
    function drawTopHud(t) {
      ctx.save(); ctx.globalAlpha = .44; mono('NEXT·STOP  /  PRODUCT FILM', 46, 41, 11, 500, '#cbd5e1'); mono(`00:${String(Math.floor(t)).padStart(2, '0')}`, 674, 41, 11, 500, '#cbd5e1', 'right'); ctx.restore();
    }
    function sceneLabel(label, title, t, start, end) {
      const a = fade(t, start, end, .28, .38); if (a <= 0) return;
      ctx.save(); ctx.globalAlpha = a; mono(label, 360, 154, 14, 500, Y, 'center'); text(title, 360, 216, 48, 600, WHITE, 'center', 'Space Grotesk'); ctx.restore();
    }

    function sceneIdea(t) {
      const a = fade(t, 0, 3.8, .45, .45); if (a <= 0) return;
      ctx.save(); ctx.globalAlpha = a; drawBrand(78, a);
      mono('REAL-TIME TRIPS · ACROSS INDIA', 360, 312, 13, 600, Y, 'center');
      text('Where to', 360, 490, 84, 600, WHITE, 'center', 'Space Grotesk');
      text('next?', 360, 584, 84, 600, Y, 'center', 'Space Grotesk');
      wrap('One clear trip plan, built around you.', 360, 672, 470, 20, 29, '#cbd5e1', 500, 'center');
      const p = ease(inv(1.35, 2.7, t));
      rounded(102, 826, 516, 62, 31, 'rgba(255,255,255,.07)', 'rgba(253,224,71,.38)');
      text('⌕', 132, 866, 28, 500, '#cbd5e1'); text('Search a city, state or vibe…', 170, 863, 17, 500, '#8793aa');
      rounded(551, 839, 38, 38, 19, Y); text('→', 570, 865, 22, 800, INK, 'center');
      ctx.globalAlpha = a * p; pill(248, 948, 'Search  ·  Budget  ·  Live fares', { size: 13, color: Y, stroke: 'rgba(253,224,71,.36)', fill: 'rgba(253,224,71,.08)' });
      ctx.restore();
    }

    function deviceFrame(t, fn) {
      const x = 76, y = 188, w = 568, h = 858, a = fade(t, 3.45, 20.15, .45, .45);
      if (a <= 0) return;
      ctx.save(); ctx.globalAlpha = a;
      ctx.shadowColor = 'rgba(0,0,0,.65)'; ctx.shadowBlur = 56; ctx.shadowOffsetY = 30; rounded(x, y, w, h, 42, '#0b091b'); ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;
      rounded(x + 7, y + 7, w - 14, h - 14, 36, '#18133e', 'rgba(255,255,255,.24)');
      rounded(294, y + 19, 132, 23, 14, '#05040b');
      text('9:41', 110, y + 37, 11, 800, WHITE); text('▮▮▮  ◼', 608, y + 37, 10, 700, WHITE, 'right');
      drawBrand(y + 82, 1, { x: x - 46, compact: true });
      ctx.save(); rounded(x + 14, y + 116, w - 28, h - 140, 25); ctx.clip(); fn(x + 14, y + 116, w - 28, h - 140); ctx.restore();
      // app bottom nav, mirroring the real product navigation pattern
      ctx.fillStyle = 'rgba(9,7,25,.94)'; ctx.fillRect(x + 14, y + h - 80, w - 28, 66);
      ['Explore', 'Budget', 'Fares', 'Trip'].forEach((label, i) => { const xx = x + 82 + i * 132; text(['⌕', '◔', '↕', '⌁'][i], xx, y + h - 48, 17, 700, i === activeScreen(t) ? Y : '#7d86a3', 'center'); text(label, xx, y + h - 27, 10, 700, i === activeScreen(t) ? WHITE : '#7d86a3', 'center'); });
      ctx.restore();
    }
    function activeScreen(t) { if (t < 7.8) return 0; if (t < 11.7) return 1; if (t < 15.6) return 2; return 3; }

    function searchScreen(x, y, w, h, t) {
      ctx.fillStyle = '#17123d'; ctx.fillRect(x, y, w, h);
      sceneLabel('01 — SEARCH', 'Find the feeling.', t, 3.55, 7.75);
      rounded(x + 30, y + 114, w - 60, 53, 27, 'rgba(255,255,255,.07)', 'rgba(253,224,71,.46)');
      text('⌕', x + 55, y + 149, 25, 500, '#cbd5e1'); text('Jaipur', x + 91, y + 147, 18, 700, WHITE); ctx.fillStyle = Y; ctx.fillRect(x + 166, y + 127, 2, 25);
      rounded(x + 30, y + 191, w - 60, 348, 25, 'rgba(255,255,255,.055)', 'rgba(255,255,255,.11)');
      imageCover(jaipur, x + 30, y + 191, w - 60, 178, 25);
      rounded(x + 46, y + 207, 118, 26, 13, 'rgba(10,6,25,.55)', 'rgba(255,255,255,.25)'); text('★ 4.8 · Trending', x + 105, y + 225, 11, 700, WHITE, 'center');
      text('Jaipur', x + 54, y + 415, 31, 600, WHITE, 'left', 'Space Grotesk'); text('Rajasthan · The Pink City', x + 54, y + 445, 14, 500, MUTED);
      rounded(x + w - 86, y + 393, 36, 36, 18, Y); text('→', x + w - 68, y + 418, 20, 800, INK, 'center');
      pill(x + 48, y + 478, '🍁 Best in Sharad', { size: 11, px: 10, h: 28, color: Y, stroke: 'rgba(253,224,71,.4)', fill: 'rgba(253,224,71,.1)' });
      pill(x + 194, y + 478, '3D · 2N', { size: 11, px: 10, h: 28 }); pill(x + 285, y + 478, 'from ₹6,800', { size: 11, px: 10, h: 28 });
      text('Also worth a stop', x + 33, y + 603, 13, 500, '#71809d'); pill(x + 166, y + 580, 'Udaipur', { size: 11, px: 10, h: 28 }); pill(x + 252, y + 580, 'Jodhpur', { size: 11, px: 10, h: 28 });
    }

    function budgetScreen(x, y, w, h, t) {
      ctx.fillStyle = '#17123d'; ctx.fillRect(x, y, w, h); sceneLabel('02 — BUDGET', 'Make the money work.', t, 7.55, 11.65);
      mono('TOTAL BUDGET', x + 32, y + 111, 12, 500, MUTED); text('₹25,000', x + 32, y + 171, 53, 600, Y, 'left', 'Space Grotesk');
      const cx = x + w / 2, cy = y + 355, rr = 112;
      ctx.lineWidth = 31; ctx.strokeStyle = 'rgba(255,255,255,.07)'; ctx.beginPath(); ctx.arc(cx, cy, rr, 0, TAU); ctx.stroke();
      const pieces = [[.4, Y], [.25, TRAIN], [.2, BUS], [.15, PURPLE]]; let start = -Math.PI / 2;
      pieces.forEach(([part, color]) => { ctx.strokeStyle = color; ctx.shadowColor = color; ctx.shadowBlur = 16; ctx.beginPath(); ctx.arc(cx, cy, rr, start + .03, start + part * TAU - .03); ctx.stroke(); start += part * TAU; }); ctx.shadowBlur = 0;
      text('₹25K', cx, cy + 7, 29, 700, WHITE, 'center', 'Space Grotesk'); text('smart split', cx, cy + 31, 12, 500, MUTED, 'center');
      const rows = [['Stay', '40%', Y], ['Travel', '25%', TRAIN], ['Food', '20%', BUS], ['Activities', '15%', PURPLE]];
      rows.forEach(([name, percent, color], i) => { const yy = y + 530 + i * 57; ctx.fillStyle = color; ctx.beginPath(); ctx.arc(x + 37, yy - 5, 5, 0, TAU); ctx.fill(); text(name, x + 54, yy, 14, 600, '#e2e8f0'); text(percent, x + w - 34, yy, 14, 700, WHITE, 'right'); rounded(x + 33, yy + 14, w - 66, 5, 3, 'rgba(255,255,255,.08)'); rounded(x + 33, yy + 14, (w - 66) * parseInt(percent, 10) / 40, 5, 3, color); });
    }

    function faresScreen(x, y, w, h, t) {
      ctx.fillStyle = '#17123d'; ctx.fillRect(x, y, w, h); sceneLabel('03 — LIVE FARES', 'See the right moment.', t, 11.45, 15.55);
      text('Delhi → Jaipur', x + 32, y + 112, 26, 600, WHITE, 'left', 'Space Grotesk'); text('Sat, 18 Oct · 1 traveller', x + 32, y + 139, 13, 500, MUTED);
      pill(x + w - 100, y + 101, '● LIVE', { size: 11, px: 10, h: 29, color: '#fca5a5', stroke: 'rgba(239,68,68,.42)', fill: 'rgba(239,68,68,.1)' });
      rounded(x + 30, y + 178, w - 60, 155, 20, 'rgba(255,255,255,.055)', 'rgba(255,255,255,.1)'); text('Lowest fare today', x + 52, y + 215, 13, 500, MUTED); text('₹755', x + 52, y + 270, 41, 700, Y, 'left', 'Space Grotesk'); pill(x + 167, y + 240, '▼ 12%', { size: 11, px: 9, h: 27, color: GREEN, stroke: 'rgba(74,222,128,.35)', fill: 'rgba(74,222,128,.1)' });
      ctx.strokeStyle = 'rgba(253,224,71,.75)'; ctx.lineWidth = 3; ctx.beginPath(); for (let i = 0; i < 28; i++) { const xx = x + 50 + i * (w - 100) / 27, yy = y + 302 - (Math.sin(i * 1.3) * 12 + (i / 27) * 46); if (i) ctx.lineTo(xx, yy); else ctx.moveTo(xx, yy); } ctx.stroke();
      const fares = [['🚆', TRAIN, 'Shatabdi Express', '₹755'], ['🚌', BUS, 'Volvo AC Sleeper', '₹899'], ['✈️', Y, 'IndiGo 6E 2131', '₹3,420']];
      fares.forEach(([icon, color, name, price], i) => { const yy = y + 382 + i * 86; rounded(x + 30, yy, w - 60, 70, 16, i === 0 ? 'rgba(253,224,71,.08)' : 'rgba(255,255,255,.045)', i === 0 ? 'rgba(253,224,71,.34)' : 'rgba(255,255,255,.09)'); text(icon, x + 58, yy + 43, 22, 400, WHITE, 'center'); text(name, x + 89, yy + 30, 13, 600, WHITE); text(i === 0 ? 'BEST PRICE · 4h 25m' : 'Live update · today', x + 89, yy + 51, 10, 500, MUTED); text(price, x + w - 51, yy + 37, 16, 700, color, 'right', 'Space Grotesk'); });
    }

    function tripScreen(x, y, w, h, t) {
      ctx.fillStyle = '#17123d'; ctx.fillRect(x, y, w, h); sceneLabel('04 — ITINERARY', 'Your trip, auto-built.', t, 15.35, 20.1);
      mono('YOUR PERSONAL ITINERARY', x + 32, y + 106, 12, 500, MUTED); text('Your Jaipur trip', x + 32, y + 153, 29, 600, WHITE, 'left', 'Space Grotesk'); text('3 days · ₹24,180 of ₹25,000', x + 32, y + 180, 13, 500, MUTED);
      rounded(x + 32, y + 198, w - 64, 5, 3, 'rgba(255,255,255,.08)'); rounded(x + 32, y + 198, (w - 64) * .967, 5, 3, Y);
      pill(x + 32, y + 227, 'Day 1', { size: 12, px: 13, h: 31, color: INK, stroke: false, fill: Y, weight: 800 }); pill(x + 113, y + 227, 'Day 2', { size: 12, px: 13, h: 31 }); pill(x + 194, y + 227, 'Day 3', { size: 12, px: 13, h: 31 });
      const items = [['09:00', 'Amber Fort', 'Entry ₹200 · beat the queues', '🎟'], ['13:00', 'Lunch at LMB', 'Old City · try the ghewar', '🍛'], ['16:30', 'Hawa Mahal', 'Best light at golden hour', '📸'], ['19:30', 'Chokhi Dhani', 'Cab ₹350 · book ahead', '🚕']];
      line(x + 43, y + 326, x + 43, y + 677, 'rgba(253,224,71,.4)', 2);
      items.forEach(([time, name, desc, icon], i) => { const yy = y + 300 + i * 91; ctx.fillStyle = INK; ctx.beginPath(); ctx.arc(x + 43, yy + 22, 14, 0, TAU); ctx.fill(); ctx.strokeStyle = Y; ctx.lineWidth = 2; ctx.stroke(); text(icon, x + 43, yy + 27, 11, 400, WHITE, 'center'); rounded(x + 74, yy, w - 106, 67, 15, 'rgba(255,255,255,.055)', 'rgba(255,255,255,.1)'); mono(time, x + 91, yy + 20, 10, 500, Y); text(name, x + 91, yy + 42, 14, 700, WHITE, 'left', 'Space Grotesk'); text(desc, x + 91, yy + 58, 10, 500, MUTED); });
      rounded(x + 90, y + 700, w - 180, 38, 19, 'rgba(74,222,128,.12)', 'rgba(74,222,128,.4)'); text('✓  Itinerary ready · saved offline', x + w / 2, y + 724, 11, 700, '#bbf7d0', 'center');
    }

    function sceneFinal(t) {
      const a = fade(t, 19.2, 24, .5, .55); if (a <= 0) return;
      ctx.save(); ctx.globalAlpha = a; ctx.fillStyle = 'rgba(7,5,26,.84)'; ctx.fillRect(0, 0, W, H); drawBrand(100, 1);
      rounded(270, 326, 180, 180, 43, Y); text('N→S', 360, 438, 60, 700, INK, 'center', 'Space Grotesk');
      text('NEXT·STOP', 360, 628, 62, 700, Y, 'center', 'Space Grotesk');
      wrap('Every stop, every stay, every fare — live.', 360, 698, 490, 22, 32, '#e2e8f0', 500, 'center');
      const p = ease(inv(20.8, 21.45, t)); rounded(123, 838, 474, 65, 33, Y); text('Start planning  →', 360, 879, 23, 800, INK, 'center');
      const seasons = ['🌸', '☀️', '🌧️', '🍁', '❄️', '☃️']; const names = ['Vasant', 'Grishma', 'Varsha', 'Sharad', 'Hemant', 'Shishir']; seasons.forEach((em, i) => { const xx = 105 + i * 102; ctx.globalAlpha = a * (.55 + p * .45); text(em, xx, 1020, 30, 400, WHITE, 'center'); text(names[i], xx, 1050, 10, 600, i === 3 ? Y : '#cbd5e1', 'center'); });
      mono('REAL-TIME TRIPS · SEASON BY SEASON', 360, 1157, 12, 500, MUTED, 'center');
      ctx.restore();
    }

    function caption(t) {
      const index = VOICEOVER.findIndex((item, i) => t >= item.at && t < (VOICEOVER[i + 1] ? VOICEOVER[i + 1].at : DUR));
      if (index < 0) return;
      const item = VOICEOVER[index]; const a = fade(t, item.at, VOICEOVER[index + 1]?.at || DUR, .22, .28);
      ctx.save(); ctx.globalAlpha = a * .98; rounded(40, 1183, 640, 60, 18, 'rgba(9,7,27,.84)', 'rgba(253,224,71,.28)'); mono(item.label, 61, 1207, 10, 500, Y); wrap(item.text, 61, 1230, 594, 13, 17, WHITE, 600); ctx.restore();
    }

    function render(t) {
      current = clamp(t, 0, DUR); drawBackground(current); drawTopHud(current);
      sceneIdea(current);
      if (current >= 3.35 && current < 7.95) deviceFrame(current, (x, y, w, h) => searchScreen(x, y, w, h, current));
      if (current >= 7.35 && current < 11.85) deviceFrame(current, (x, y, w, h) => budgetScreen(x, y, w, h, current));
      if (current >= 11.15 && current < 15.75) deviceFrame(current, (x, y, w, h) => faresScreen(x, y, w, h, current));
      if (current >= 14.95 && current < 20.35) deviceFrame(current, (x, y, w, h) => tripScreen(x, y, w, h, current));
      sceneFinal(current); caption(current);
    }

    function currentVoiceIndex(t) { return VOICEOVER.findIndex((item, i) => t >= item.at && t < (VOICEOVER[i + 1] ? VOICEOVER[i + 1].at : DUR)); }
    function speak(index) {
      if (!voiceEnabled || !window.speechSynthesis || index < 0) return;
      window.speechSynthesis.cancel();
      const item = VOICEOVER[index]; utterance = new SpeechSynthesisUtterance(item.text); utterance.rate = .94; utterance.pitch = 1; utterance.volume = 1;
      const voices = window.speechSynthesis.getVoices(); utterance.voice = voices.find((v) => /en-IN/i.test(v.lang)) || voices.find((v) => /^en/i.test(v.lang)) || null;
      window.speechSynthesis.speak(utterance);
    }
    function updateVoice(t) { const index = currentVoiceIndex(t); if (index !== lastVoiceIndex) { lastVoiceIndex = index; if (index >= 0) speak(index); } }
    function setPlaying(value) {
      playing = value; playButton.textContent = playing ? 'Pause' : 'Play with voiceover'; last = performance.now();
      if (!playing && window.speechSynthesis) window.speechSynthesis.pause();
      if (playing && window.speechSynthesis) { window.speechSynthesis.resume(); updateVoice(current); }
      statusEl.innerHTML = playing ? '<b>● Playing</b> · voiceover is on' : 'Paused · press Play with voiceover to continue';
    }
    function restart() { if (window.speechSynthesis) window.speechSynthesis.cancel(); current = 0; lastVoiceIndex = -1; render(0); setPlaying(true); }
    function seek(value) { current = clamp(value, 0, DUR); lastVoiceIndex = currentVoiceIndex(current) - 1; render(current); if (playing) updateVoice(current); }

    playButton.addEventListener('click', () => setPlaying(!playing));
    restartButton.addEventListener('click', restart);
    voiceButton.addEventListener('click', () => { voiceEnabled = !voiceEnabled; voiceButton.textContent = voiceEnabled ? 'Voiceover on' : 'Voiceover off'; voiceButton.classList.toggle('voice-off', !voiceEnabled); if (!voiceEnabled && window.speechSynthesis) window.speechSynthesis.cancel(); if (voiceEnabled && playing) { lastVoiceIndex = -1; updateVoice(current); } });
    scrub.addEventListener('input', () => { const wasPlaying = playing; setPlaying(false); seek(Number(scrub.value) / 1000); if (wasPlaying) setPlaying(true); });
    window.addEventListener('keydown', (event) => { if (event.code === 'Space') { event.preventDefault(); setPlaying(!playing); } else if (event.code === 'ArrowRight') seek(current + (event.shiftKey ? .1 : 1)); else if (event.code === 'ArrowLeft') seek(current - (event.shiftKey ? .1 : 1)); else if (event.code === 'KeyR') restart(); });
    window.speechSynthesis?.addEventListener?.('voiceschanged', () => {});

    function tick(now) {
      const dt = Math.min(.1, (now - last) / 1000); last = now;
      if (playing) { current += dt; updateVoice(current); if (current >= DUR) { current = DUR; playing = false; playButton.textContent = 'Play with voiceover'; statusEl.innerHTML = '<b>Finished</b> · press Restart or Play with voiceover'; if (window.speechSynthesis) window.speechSynthesis.cancel(); } }
      render(current); scrub.value = Math.round(current * 1000); timeEl.textContent = `${current.toFixed(2).padStart(5, '0')} / 24.00`; raf = requestAnimationFrame(tick);
    }
    render(0); raf = requestAnimationFrame(tick);
    window.addEventListener('beforeunload', () => { cancelAnimationFrame(raf); if (window.speechSynthesis) window.speechSynthesis.cancel(); });
  })();
  </script>
</body>
