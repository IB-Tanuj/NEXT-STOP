<!doctype html>
<!--
  NEXT·STOP — Ad #2 "Plan it together" (9:16 · 32s · voiceover + music + SFX)
  -------------------------------------------------------------------------
  • Double-click to open in Chrome/Edge. Click "Tap to play" (browsers need a click to allow sound).
  • Requires ./next-stop-ad-2-vo.js (base64 voiceover, en-IN-NeerjaNeural) next to this file.
  • The whole soundtrack (music + SFX + voiceover, with ducking) is rendered once with an
    OfflineAudioContext, so playback, scrubbing and the exported video stay in perfect sync.
  • URL params:  ?t=12.5 (jump & pause)   ?clean=1 (hide controls)
  • Keys: Space play/pause · ←/→ seek · R restart · M mute · H hide UI
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>NEXT·STOP — Ad #2 · Plan it together (9:16)</title>
<meta name="description" content="A 32-second colourful vertical ad for NEXT·STOP with voiceover: find friends, save trips, share trips, split costs and save up together." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root { --or:#FF7A1A; --ink:#1F1300; --yel:#FFD23F; --cream:#FFF4E6; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { height:100%; }
  body { background: radial-gradient(1200px 800px at 50% 40%, #3b1c08 0%, #160a03 65%, #090401 100%); color:var(--cream); font-family: Inter, system-ui, sans-serif; overflow:hidden; }
  .sr-only { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
  main { height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; padding:14px; }
  .stage-wrap { position:relative; height: calc(100vh - 110px); aspect-ratio: 9 / 16; max-width:100%; }
  #stage { width:100%; height:100%; display:block; border-radius:22px; background:var(--or);
    box-shadow: 0 40px 120px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.08), 0 0 90px rgba(255,122,26,.18); }
  #tap { position:absolute; inset:0; border:0; border-radius:22px; cursor:pointer; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px;
    background: rgba(31,19,0,.35); backdrop-filter: blur(3px); color:var(--cream); font: 800 22px Inter, sans-serif; transition: opacity .3s ease; }
  #tap .disc { width:96px; height:96px; border-radius:50%; background:var(--yel); border:5px solid var(--ink); box-shadow: 8px 8px 0 var(--ink);
    display:grid; place-items:center; color:var(--ink); font-size:38px; transition: transform .2s ease, box-shadow .2s ease; }
  #tap:hover .disc { transform: translate(-3px,-3px) scale(1.05); box-shadow: 11px 11px 0 var(--ink); }
  #tap small { font: 600 13px Inter, sans-serif; opacity:.85; }
  #tap.hidden { opacity:0; pointer-events:none; }
  .controls { display:flex; align-items:center; gap:10px; padding:10px 14px; border-radius:999px; background: rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.12); backdrop-filter: blur(14px); width:min(880px, 100%); }
  .controls button { font: 700 13px Inter, sans-serif; color:var(--cream); background: rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.14); border-radius:999px; padding:8px 14px; cursor:pointer; transition: all .2s ease; white-space:nowrap; }
  .controls button:hover { background: rgba(255,210,63,.16); border-color: rgba(255,210,63,.55); color: var(--yel); transform: translateY(-1px); }
  .controls button.primary { background: var(--yel); color: var(--ink); border-color: var(--yel); }
  .controls button.primary:hover { color: var(--ink); box-shadow: 0 8px 24px rgba(255,210,63,.35); }
  .controls button:disabled { opacity:.5; cursor:default; transform:none; }
  #scrub { flex:1; accent-color: var(--or); cursor:pointer; }
  #time { font: 600 12px ui-monospace, Consolas, monospace; color:#e9cdb3; min-width: 104px; text-align:right; }
  #status { font: 600 12px Inter, sans-serif; color:#e9cdb3; min-height:16px; }
  #status b { color: var(--yel); }
  body.clean main { padding:0; gap:0; }
  body.clean .stage-wrap { height:100vh; }
  body.clean #stage, body.clean #tap { border-radius:0; box-shadow:none; }
  body.clean .controls, body.clean #status { display:none; }
</style>
</head>
<body>
<main>
  <h1 class="sr-only">NEXT·STOP — Plan it together · 32 second vertical ad with voiceover</h1>
  <div class="stage-wrap">
    <canvas id="stage" width="1080" height="1920" aria-label="NEXT·STOP animated advertisement: plan it together"></canvas>
    <button id="tap" type="button" aria-label="Play with sound"><span class="disc">▶</span><span id="tap-label">Preparing sound…</span><small>Voiceover · music · 32s</small></button>
  </div>
  <div class="controls">
    <button id="btn-play" type="button">Play</button>
    <button id="btn-restart" type="button">Restart</button>
    <button id="btn-mute" type="button">🔊 Sound</button>
    <input id="scrub" type="range" min="0" max="32000" step="10" value="0" aria-label="Timeline" />
    <span id="time">00.00 / 32.00</span>
    <button id="btn-export" class="primary" type="button">Export video</button>
  </div>
  <div id="status">Space play/pause · ←/→ seek · R restart · M mute · H hide controls</div>
</main>

<script src="./next-stop-ad-2-vo.js"></script>
<script>
(() => {
'use strict';

/* ════════════════════════════════════════════════════════════
   CORE
   ════════════════════════════════════════════════════════════ */
const W = 1080, H = 1920, DUR = 32, TAU = Math.PI * 2;
const OR = '#FF7A1A', OR2 = '#FF8E3C', PINK = '#FF3D7F', YEL = '#FFD23F', TEAL = '#00C2A8',
      SKY = '#3EC1FF', LIME = '#A3E635', CREAM = '#FFF4E6', INK = '#1F1300', RED = '#FF2E2E';
const DISPLAY = 'Bricolage Grotesque';
const cvs = document.getElementById('stage');
const ctx = cvs.getContext('2d');

const clamp = (v, a = 0, b = 1) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const inv = (a, b, v) => clamp((v - a) / (b - a));
const E = {
  outCubic: t => 1 - Math.pow(1 - t, 3),
  inCubic: t => t * t * t,
  inOutCubic: t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,
  outBack: t => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); },
  inOutSine: t => -(Math.cos(Math.PI * t) - 1) / 2,
};
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rand = mulberry32(31102026);
function mk(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
const inr = v => '₹' + Math.round(v).toLocaleString('en-IN');
function font(size, weight = 700, fam = 'Inter') { return `${weight} ${size}px "${fam}", Inter, system-ui, sans-serif`; }
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, Math.max(0, w), Math.max(0, h), r); }
function txt(s, x, y, size, weight, color, align = 'left', fam = 'Inter') {
  ctx.font = font(size, weight, fam); ctx.fillStyle = color; ctx.textAlign = align; ctx.textBaseline = 'alphabetic'; ctx.fillText(s, x, y);
}
function tw(s, size, weight = 700, fam = 'Inter') { ctx.font = font(size, weight, fam); return ctx.measureText(s).width; }
/* neo-brutalist sticker card: hard offset shadow + thick ink outline */
function card(x, y, w, h, r, fill, off = 12, lw = 5) {
  rr(x + off, y + off, w, h, r); ctx.fillStyle = INK; ctx.fill();
  rr(x, y, w, h, r); ctx.fillStyle = fill; ctx.fill(); ctx.lineWidth = lw; ctx.strokeStyle = INK; ctx.stroke();
}
/* scale-pop around a pivot */
function popAt(t, t0, cx, cy, fn, dur = .45) {
  const p = inv(t0, t0 + dur, t); if (p <= 0) return;
  const s = E.outBack(p);
  ctx.save(); ctx.translate(cx, cy); ctx.scale(s, s); ctx.translate(-cx, -cy); ctx.globalAlpha *= clamp(p * 2.5); fn(p); ctx.restore();
}
function btn(cx, cy, w, h, label, fill, col, press = 0, size = 38) {
  const off = 10 * (1 - press);
  rr(cx - w / 2 + 10, cy - h / 2 + 10, w, h, h / 2); ctx.fillStyle = INK; ctx.fill();
  rr(cx - w / 2 + 10 - off, cy - h / 2 + 10 - off, w, h, h / 2); ctx.fillStyle = fill; ctx.fill();
  ctx.lineWidth = 5; ctx.strokeStyle = INK; ctx.stroke();
  txt(label, cx + 10 - off, cy + 10 - off + size * .36, size, 800, col, 'center');
}

/* ════════════════════════════════════════════════════════════
   TIMELINE  (shared by visuals AND the audio score)
   ════════════════════════════════════════════════════════════ */
const TW = [3.3, 7.2, 11.8, 17.5, 22.3, 27.0];               // colour-wipe transition times
const WIPE_ORIGIN = [[540, 1000], [540, 980], [540, 1110], [540, 1080], [540, 880], [540, 1000]];
const VO_TEXT = [
  'Trips are better with your people.',
  'No more lost screenshots in the group chat.',
  'Find your friends on NEXT·STOP, and add them in one tap.',
  'Save every trip you dream up. Plan and budget, in one place.',
  'Then share it. Your friends join instantly.',
  'Split costs with a shared wallet, and save up as a group.',
  'NEXT·STOP. Plan it together!',
];
// voiceover file order (generated in a different order) → caption order above
const VO_FILE = [0, 5, 1, 2, 3, 4, 6];
const VO_TARGET = [0.45, 3.45, 7.35, 11.95, 17.7, 22.45, 27.25];
let VO_T = VO_TARGET.map((s, i) => [s, s + [2.4, 3.2, 4.0, 5.0, 4.1, 4.0, 3.2][i]]); // refined after decode

/* ════════════════════════════════════════════════════════════
   PEOPLE / AVATARS
   ════════════════════════════════════════════════════════════ */
const PEOPLE = [
  { n: 'You',   bg: YEL,  skin: '#E0AC69', hair: 0 },
  { n: 'Riya',  bg: PINK, skin: '#F1C27D', hair: 1 },
  { n: 'Arjun', bg: SKY,  skin: '#C68642', hair: 2 },
  { n: 'Meera', bg: TEAL, skin: '#FFDBAC', hair: 3 },
  { n: 'Kabir', bg: LIME, skin: '#E0AC69', hair: 4 },
];
function avatar(x, y, r, idx, t = 0) {
  const p = PEOPLE[idx], HAIR = '#2B1B10';
  ctx.save();
  ctx.beginPath(); ctx.arc(x + r * .1, y + r * .1, r, 0, TAU); ctx.fillStyle = INK; ctx.fill();
  ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fillStyle = p.bg; ctx.fill();
  ctx.save(); ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.clip();
  const hx = x, hy = y - r * .08, hr = r * .42;
  if (p.hair === 1) { ctx.fillStyle = HAIR; rr(hx - hr * 1.15, hy - hr * .9, hr * 2.3, hr * 2.6, hr); ctx.fill(); }
  ctx.fillStyle = CREAM; ctx.beginPath(); ctx.ellipse(x, y + r * .95, r * .72, r * .5, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = p.skin; ctx.fillRect(hx - hr * .3, hy + hr * .7, hr * .6, hr * .6);
  ctx.beginPath(); ctx.arc(hx, hy, hr, 0, TAU); ctx.fill();
  ctx.fillStyle = HAIR;
  if (p.hair === 0) { ctx.beginPath(); ctx.arc(hx, hy - hr * .1, hr * 1.02, Math.PI * 1.02, Math.PI * 1.98); ctx.fill(); }
  if (p.hair === 1) { ctx.beginPath(); ctx.arc(hx, hy - hr * .05, hr * 1.05, Math.PI, TAU); ctx.fill(); }
  if (p.hair === 2) { ctx.beginPath(); ctx.moveTo(hx - hr, hy - hr * .1); for (let k = 0; k <= 6; k++) ctx.lineTo(hx - hr + k * hr / 3, hy - hr * (k % 2 ? 1.35 : 1.0)); ctx.lineTo(hx + hr, hy - hr * .1); ctx.closePath(); ctx.fill(); }
  if (p.hair === 3) { ctx.beginPath(); ctx.arc(hx, hy - hr * .1, hr * 1.02, Math.PI * 1.05, Math.PI * 1.95); ctx.fill(); ctx.beginPath(); ctx.arc(hx, hy - hr * 1.25, hr * .42, 0, TAU); ctx.fill(); }
  if (p.hair === 4) { for (let k = 0; k < 7; k++) { const a = Math.PI * (1.05 + k * .15); ctx.beginPath(); ctx.arc(hx + Math.cos(a) * hr * .85, hy + Math.sin(a) * hr * .85, hr * .34, 0, TAU); ctx.fill(); } }
  const blink = ((t * .7 + idx * .37) % 3) < .08 ? .2 : 1;
  ctx.fillStyle = INK;
  ctx.beginPath(); ctx.ellipse(hx - hr * .36, hy + hr * .05, hr * .1, hr * .13 * blink, 0, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.ellipse(hx + hr * .36, hy + hr * .05, hr * .1, hr * .13 * blink, 0, 0, TAU); ctx.fill();
  ctx.strokeStyle = INK; ctx.lineWidth = Math.max(1.5, hr * .1); ctx.lineCap = 'round';
  ctx.beginPath(); ctx.arc(hx, hy + hr * .25, hr * .32, Math.PI * .15, Math.PI * .85); ctx.stroke();
  ctx.fillStyle = 'rgba(255,61,127,.35)';
  ctx.beginPath(); ctx.arc(hx - hr * .6, hy + hr * .35, hr * .14, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.arc(hx + hr * .6, hy + hr * .35, hr * .14, 0, TAU); ctx.fill();
  ctx.restore();
  ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.lineWidth = Math.max(3, r * .07); ctx.strokeStyle = INK; ctx.stroke();
  ctx.restore();
}
function checkBadge(x, y, r, col = TEAL) {
  ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fillStyle = col; ctx.fill(); ctx.lineWidth = 4; ctx.strokeStyle = INK; ctx.stroke();
  ctx.strokeStyle = INK; ctx.lineWidth = r * .28; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.beginPath(); ctx.moveTo(x - r * .42, y); ctx.lineTo(x - r * .1, y + r * .32); ctx.lineTo(x + r * .45, y - r * .32); ctx.stroke();
}

/* ════════════════════════════════════════════════════════════
   BACKGROUND — sunburst, floating shapes, confetti, wipes
   ════════════════════════════════════════════════════════════ */
const SHAPES = Array.from({ length: 34 }, (_, i) => ({
  x: rand() * W, y: rand() * H, s: 14 + rand() * 26, sp: 30 + rand() * 60, ph: rand() * TAU, rs: (rand() - .5) * 2,
  kind: i % 6, col: [PINK, YEL, TEAL, SKY, LIME, CREAM][Math.floor(rand() * 6)],
}));
function shape(kind, s, col) {
  ctx.fillStyle = col; ctx.strokeStyle = INK; ctx.lineWidth = 4; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  ctx.beginPath();
  if (kind === 0) { ctx.arc(0, 0, s * .5, 0, TAU); ctx.fill(); ctx.stroke(); }
  else if (kind === 1) { ctx.rect(-s * .45, -s * .45, s * .9, s * .9); ctx.fill(); ctx.stroke(); }
  else if (kind === 2) { ctx.moveTo(0, -s * .55); ctx.lineTo(s * .5, s * .4); ctx.lineTo(-s * .5, s * .4); ctx.closePath(); ctx.fill(); ctx.stroke(); }
  else if (kind === 3) { ctx.lineWidth = 7; ctx.strokeStyle = col; ctx.moveTo(-s * .7, 0); for (let k = 1; k <= 4; k++) ctx.quadraticCurveTo(-s * .7 + (k - .5) * s * .35, (k % 2 ? -1 : 1) * s * .35, -s * .7 + k * s * .35, 0); ctx.stroke(); }
  else if (kind === 4) { for (let k = 0; k < 10; k++) { const a = -Math.PI / 2 + k * Math.PI / 5, rad = k % 2 ? s * .24 : s * .55; ctx.lineTo(Math.cos(a) * rad, Math.sin(a) * rad); } ctx.closePath(); ctx.fill(); ctx.stroke(); }
  else { ctx.lineWidth = 7; ctx.strokeStyle = col; ctx.arc(0, 0, s * .4, 0, TAU); ctx.stroke(); }
}
function drawBG(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = OR; ctx.fillRect(0, 0, W, H);
  // sunburst
  const speed = t > 27 ? .16 : .05, rot = t * speed + (t > 27 ? -27 * .11 : 0);
  ctx.save(); ctx.translate(540, 980); ctx.rotate(rot); ctx.fillStyle = OR2;
  for (let k = 0; k < 18; k++) { const a = k * TAU / 18; ctx.beginPath(); ctx.moveTo(0, 0); ctx.arc(0, 0, 2000, a, a + TAU / 36); ctx.closePath(); ctx.fill(); }
  ctx.restore();
  const g = ctx.createRadialGradient(540, 980, 100, 540, 980, 1200);
  g.addColorStop(0, 'rgba(255,214,120,.45)'); g.addColorStop(1, 'rgba(232,93,4,.35)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // floating shapes
  for (const s of SHAPES) {
    const y = ((s.y - t * s.sp) % (H + 120) + H + 120) % (H + 120) - 60;
    const x = s.x + Math.sin(t * .8 + s.ph) * 30;
    ctx.save(); ctx.translate(x, y); ctx.rotate(t * s.rs + s.ph); ctx.globalAlpha = .85; shape(s.kind, s.s, s.col); ctx.restore();
  }
}
/* confetti: pure function of time */
const CONF = Array.from({ length: 90 }, () => ({ a: rand() * TAU, v: 500 + rand() * 900, rs: (rand() - .5) * 14, s: 12 + rand() * 14, col: [PINK, YEL, TEAL, SKY, LIME, CREAM][Math.floor(rand() * 6)], k: Math.floor(rand() * 3), x: rand(), d: rand() }));
function confettiBurst(t, t0, x, y, n = 60, spread = 1) {
  const e = t - t0; if (e < 0 || e > 1.8) return;
  for (let i = 0; i < n; i++) {
    const c = CONF[i % CONF.length], v = c.v * spread;
    const px = x + Math.cos(c.a) * v * e * .9, py = y + Math.sin(c.a) * v * e * .9 - 300 * e + 900 * e * e;
    ctx.save(); ctx.globalAlpha = 1 - inv(1.2, 1.8, e); ctx.translate(px, py); ctx.rotate(c.rs * e);
    ctx.fillStyle = c.col;
    if (c.k === 0) ctx.fillRect(-c.s / 2, -c.s / 4, c.s, c.s / 2); else if (c.k === 1) { ctx.beginPath(); ctx.arc(0, 0, c.s / 3, 0, TAU); ctx.fill(); } else { ctx.beginPath(); ctx.moveTo(0, -c.s / 2); ctx.lineTo(c.s / 2, c.s / 2); ctx.lineTo(-c.s / 2, c.s / 2); ctx.fill(); }
    ctx.restore();
  }
}
function confettiRain(t, t0) {
  const e = t - t0; if (e < 0) return;
  for (let i = 0; i < CONF.length; i++) {
    const c = CONF[i], fall = 260 + c.d * 260, y = ((e * fall + c.d * H) % (H + 100)) - 50;
    if (e * fall + c.d * H < c.d * H + 0 && false) continue;
    const x = c.x * W + Math.sin(e * 2 + i) * 40;
    ctx.save(); ctx.globalAlpha = inv(0, .6, e); ctx.translate(x, y); ctx.rotate(e * c.rs * .4); ctx.fillStyle = c.col;
    ctx.fillRect(-c.s / 2, -c.s / 4, c.s, c.s / 2); ctx.restore();
  }
}
function holeFill(cx, cy, R, color) {
  ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.moveTo(cx + Math.max(0, R), cy); ctx.arc(cx, cy, Math.max(0, R), 0, TAU, true);
  ctx.fillStyle = color; ctx.fill('evenodd');
}
function drawWipes(t) {
  TW.forEach((tw, k) => {
    if (t < tw - .5 || t > tw + .5) return;
    const [cx, cy] = WIPE_ORIGIN[k], MAX = 2300;
    if (t < tw) {
      [[YEL, .5, .2], [PINK, .42, .1], [TEAL, .34, 0]].forEach(([c, a, b]) => {
        const p = E.inOutCubic(inv(tw - a, tw - b, t)); if (p <= 0) return;
        ctx.beginPath(); ctx.arc(cx, cy, p * MAX, 0, TAU); ctx.fillStyle = c; ctx.fill();
        ctx.lineWidth = 8; ctx.strokeStyle = INK; ctx.stroke();
      });
    } else {
      const R = E.inOutCubic(inv(tw, tw + .5, t)) * MAX;
      holeFill(cx, cy, R, PINK); holeFill(cx, cy, R + 90, TEAL);
      ctx.beginPath(); ctx.arc(cx, cy, R, 0, TAU); ctx.lineWidth = 8; ctx.strokeStyle = INK; ctx.stroke();
    }
  });
}
const grain = mk(256, 256);
{ const g = grain.getContext('2d'), id = g.createImageData(256, 256);
  for (let i = 0; i < id.data.length; i += 4) { const v = rand() * 255; id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = 255; }
  g.putImageData(id, 0, 0); }
const grainPat = ctx.createPattern(grain, 'repeat');
function drawPost(t) {
  ctx.save(); const f = Math.floor(t * 24), ox = (f * 73) % 256, oy = (f * 151) % 256;
  ctx.globalAlpha = .045; ctx.translate(-ox, -oy); ctx.fillStyle = grainPat; ctx.fillRect(0, 0, W + 256, H + 256); ctx.restore();
}

/* ════════════════════════════════════════════════════════════
   TYPE — sticker headlines + live captions
   ════════════════════════════════════════════════════════════ */
/* words: [[text, blockColor|null], ...] */
function sticker(words, cx, y, size, t, t0, t1 = 1e9) {
  ctx.font = font(size, 800, DISPLAY);
  const gap = size * .28, padX = size * .18;
  const ws = words.map(([s, bg]) => ctx.measureText(s).width + (bg ? padX * 2 : 0));
  const total = ws.reduce((a, b) => a + b, 0) + gap * (words.length - 1);
  let x = cx - total / 2;
  words.forEach(([s, bg], i) => {
    const w = ws[i], mx = x + w / 2;
    const p = inv(t0 + i * .09, t0 + i * .09 + .45, t), q = E.inCubic(inv(t1 + i * .04, t1 + i * .04 + .28, t));
    if (p > 0 && q < 1) {
      const sc = E.outBack(p) * (1 - q);
      ctx.save(); ctx.translate(mx, y - size * .35); ctx.scale(sc, sc); ctx.rotate(bg ? -.035 : 0); ctx.translate(-mx, -(y - size * .35));
      if (bg) card(x, y - size * .92, w, size * 1.2, 18, bg, 8, 5);

  if (p) audioStart(cur); else audioStop();
}
function seek(t) { cur = clamp(t, 0, DUR - .001); dirty = true; if (playing) audioStart(cur); }
function firstPlay() { ensureCtx(); tap.classList.add('hidden'); if (cur >= DUR - .05) cur = 0; setPlaying(true); }

tap.onclick = () => { if (!audioBuf) return; seek(0); firstPlay(); };
btnPlay.onclick = () => { if (recording) return; if (!actx) return firstPlay(); setPlaying(!playing); };
btnRestart.onclick = () => { if (recording) return; ensureCtx(); tap.classList.add('hidden'); seek(0); setPlaying(true); };
btnMute.onclick = () => { muted = !muted; btnMute.textContent = muted ? '🔇 Muted' : '🔊 Sound'; if (spk) spk.gain.value = muted ? 0 : 1; };
scrub.oninput = () => { if (recording) return; if (playing) setPlaying(false); seek(scrub.value / 1000); };
window.addEventListener('keydown', e => {
  if (recording) return;
  if (e.code === 'Space') { e.preventDefault(); btnPlay.onclick(); }
  else if (e.code === 'ArrowRight') seek(cur + (e.shiftKey ? .1 : 1));
  else if (e.code === 'ArrowLeft') seek(cur - (e.shiftKey ? .1 : 1));
  else if (e.code === 'KeyR') btnRestart.onclick();
  else if (e.code === 'KeyM') btnMute.onclick();
  else if (e.code === 'KeyH') document.body.classList.toggle('clean');
});

btnExport.onclick = () => {
  if (recording || !audioBuf) return;
  if (!window.MediaRecorder || !cvs.captureStream) { statusEl.innerHTML = '<b>Export needs Chrome or Edge.</b>'; return; }
  ensureCtx(); tap.classList.add('hidden');
  const types = ['video/mp4;codecs=avc1.640034,mp4a.40.2', 'video/mp4;codecs=avc1,mp4a.40.2', 'video/mp4', 'video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm'];
  mime = types.find(m => MediaRecorder.isTypeSupported(m)) || '';
  recDest = actx.createMediaStreamDestination();
  const stream = cvs.captureStream(60); recDest.stream.getAudioTracks().forEach(tr => stream.addTrack(tr));
  recorder = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 24_000_000, audioBitsPerSecond: 256_000 });
  chunks = [];
  recorder.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
  recorder.onstop = () => {
    const blob = new Blob(chunks, { type: mime || 'video/webm' }), a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = `next-stop-ad2-plan-together-1080x1920.${(mime || '').includes('mp4') ? 'mp4' : 'webm'}`;
    document.body.appendChild(a); a.click(); a.remove();
    statusEl.innerHTML = `<b>✓ Exported</b> ${(blob.size / 1048576).toFixed(1)} MB · ${a.download}`;
    [btnPlay, btnRestart, btnExport, scrub].forEach(b => b.disabled = false); recDest = null;
  };
  [btnPlay, btnRestart, btnExport, scrub].forEach(b => b.disabled = true);
  if (playing) setPlaying(false);
  cur = 0; render(0); recorder.start(250); recording = true; setPlaying(true);
};

function tick(now) {
  const dt = (now - last) / 1000; last = now;
  if (playing) {
    cur = src ? startOffset + Math.max(0, actx.currentTime - startedAt) : cur + Math.min(dt, .1);
    if (cur >= DUR) {
      cur = DUR; setPlaying(false);
      if (recording) { recording = false; render(DUR - .001); setTimeout(() => recorder && recorder.state !== 'inactive' && recorder.stop(), 300); }
    }
    dirty = true;
  }
  if (dirty) {
    render(Math.min(cur, DUR - .001)); dirty = false;
    scrub.value = Math.round(cur * 1000);
    timeEl.textContent = `${cur.toFixed(2).padStart(5, '0')} / ${DUR.toFixed(2)}`;
    if (recording) statusEl.innerHTML = `<b>● Recording with sound</b> ${cur.toFixed(1)}s / ${DUR}s — keep this tab visible`;
  }
  requestAnimationFrame(tick);
}

/* boot */
const fontLoads = Promise.all(['800 120px "Bricolage Grotesque"', '700 40px "Bricolage Grotesque"', '600 20px Inter', '700 20px Inter', '800 20px Inter'].map(f => document.fonts.load(f)));
Promise.race([fontLoads, new Promise(r => setTimeout(r, 3500))]).then(() => {
  if (params.has('t')) { cur = clamp(parseFloat(params.get('t')) || 0, 0, DUR - .001); tap.classList.add('hidden'); }
  else cur = 28.6; // poster frame behind the play button
  dirty = true; requestAnimationFrame(tick);
  window.__seek = t => { if (playing) setPlaying(false); seek(t); };
  if (!window.NS_VO) statusEl.innerHTML = '<b>Voiceover file missing</b> — keep next-stop-ad-2-vo.js next to this HTML.';
  buildSoundtrack().then(buf => {
    audioBuf = buf; tapLabel.textContent = 'Tap to play with sound';
    if (!params.has('t')) cur = 28.6; dirty = true;
  }).catch(err => { console.error(err); tapLabel.textContent = 'Tap to play (sound failed)'; audioBuf = null; tap.onclick = () => { tap.classList.add('hidden'); cur = 0; playing = true; btnPlay.textContent = 'Pause'; }; });
});
})();
</script>
</body>
</html>
